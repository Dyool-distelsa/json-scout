<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Scout</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar" aria-label="Toolbar"></header>

      <main class="workspace">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar__header">
            <div id="sidebar-tabs" class="sidebar__tabs" role="tablist" aria-label="Sidebar" data-count="1">
              <button id="sidebar-tab-files" class="sidebar__tab active" type="button" role="tab" data-sidebar-tab="files" aria-selected="true" aria-controls="sidebar-list">Files</button>
              <button id="sidebar-tab-vault" class="sidebar__tab" type="button" role="tab" data-sidebar-tab="vault" aria-selected="false" aria-controls="sidebar-vault" tabindex="-1" hidden>Vault</button>
            </div>
            <span id="sidebar-rail-label" class="rail-label">Files</span>
            <button id="sidebar-collapse" class="icon-btn" title="Collapse Files" aria-label="Toggle Files panel" aria-expanded="true"><svg class="chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><polyline points="15 6 9 12 15 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div id="sidebar-list" class="sidebar__list" role="tabpanel" aria-labelledby="sidebar-tab-files"></div>
          <div id="sidebar-vault" class="sidebar__list sidebar__panel" role="tabpanel" aria-labelledby="sidebar-tab-vault" hidden></div>
        </aside>

        <div id="sidebar-splitter" class="splitter splitter--sidebar"></div>

        <section class="editor-pane">
          <div class="editor-pane__primary">
            <div id="doc-tabs" class="doc-tabs"></div>
            <div class="editor-pane__body">
              <div id="editor" class="editor"></div>
              <button
                id="copy-btn"
                class="copy-btn"
                type="button"
                title="Copy editor content"
                aria-label="Copy editor content"
              >
                Copy
              </button>
            </div>
          </div>
          <div class="editor-pane__diff-container" id="diff-secondary-container" hidden>
            <div id="editor-secondary" class="editor"></div>
          </div>
        </section>

        <div id="right-splitter" class="splitter splitter--right"></div>

        <aside id="right-panel" class="right-panel">
          <div class="right-panel__header">
            <span class="rail-label">Tools</span>
            <button id="right-panel-collapse" class="icon-btn" title="Collapse Tools" aria-label="Toggle Tools panel" aria-expanded="true"><svg class="chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><polyline points="9 6 15 12 9 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <nav class="tabs" id="right-panel-tabs">
            <button class="tab active" data-tab="tree">Tree</button>
            <button class="tab" data-tab="query">Query</button>
            <button class="tab" data-tab="diff">Diff</button>
            <button class="tab" data-tab="convert">Convert</button>
            <button class="tab" data-tab="stats">Stats</button>
            <button class="tab" data-tab="settings">Settings</button>
            <button class="tab" data-tab="help">Help</button>
          </nav>
          <div class="tab-panels" id="right-panel-panels">
            <div class="tab-panel active" data-panel="tree" id="panel-tree"></div>
            <div class="tab-panel" data-panel="query" id="panel-query"></div>
            <div class="tab-panel" data-panel="diff" id="panel-diff"></div>
            <div class="tab-panel" data-panel="convert" id="panel-convert"></div>
            <div class="tab-panel" data-panel="stats" id="panel-stats"></div>
            <div class="tab-panel" data-panel="settings" id="panel-settings"></div>
            <div class="tab-panel" data-panel="help" id="panel-help"></div>
          </div>
        </aside>
      </main>

      <footer id="statusbar" class="statusbar"></footer>
    </div>
    <div id="toast-container" class="toast-container" aria-label="Notifications"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
